    Content: "What I've learned running service desks: identity, employee experience, and the gap between green SLAs and happy users."

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/cdozdike"
    - name: x
      url: "https://x.com/@chidodike"
    - name: github
      url: "https://github.com/chidodike"

  cover:
    hidden: false
    hiddenInList: false # show covers on home / lists
    hiddenInSingle: false # show covers on posts (front matter can still hide)

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: about
      name: About
      url: https://chido.me/
      weight: 30

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
