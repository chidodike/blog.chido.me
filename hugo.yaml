baseURL: "https://blog.chido.me/"
title: "Chido Dike"
pagination:
  pagerSize: 5
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

taxonomies:
  category: categories
  tag: tags

minify:
  disableXML: true
  minifyOutput: true

params:
