baseURL: "https://blog.chido.me/"
title: "Chido Dike"
pagination:
  pagerSize: 5
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

taxonomies:
  category: categories
  tag: tags

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # opengraph, twitter-cards, schema
  title: "Chido Dike"
  description: "Notes on digital employee experience, Intune, identity, and making enterprise tech feel human."
  keywords: [DEX, Intune, Entra ID, Modern Workplace, ITSM, Zero Trust, Employee Experience]
  author: Chido Dike
  images: ["/og-default.png"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/apple-touch-icon.png"

  label:
    text: "Chido Dike"
    icon: /apple-touch-icon.png
    iconHeight: 35

  profileMode:
    enabled: false

  homeInfoParams:
    Title: "Making enterprise tech feel human"
    Content: "What I've learned running service desks: identity, employee experience, and the gap between green SLAs and happy users."

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/cdozdike"
    - name: x
      url: "https://x.com/@chidodike"
    - name: github
      url: "https://github.com/chidodike"

  cover:
    hidden: false
    hiddenInList: false # show covers on home / lists
    hiddenInSingle: false # show covers on posts (front matter can still hide)

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: about
      name: About
      url: https://chido.me/
      weight: 30

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
